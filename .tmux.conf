# ─────────────────────────────────────────────
#  RELOAD CONFIG
# ─────────────────────────────────────────────

# Καταργεί την προεπιλεγμένη λειτουργία του πλήκτρου "r"
# (κανονικά το prefix + r δεν κάνει τίποτα χρήσιμο)
unbind r

# Ορίζει: prefix + r  ->  ξαναφορτώνει το ~/.tmux.conf
# Έτσι δεν χρειάζεται να κλείνεις/ανοίγεις το tmux σε κάθε αλλαγή
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"


# ─────────────────────────────────────────────
#  ΓΕΝΙΚΕΣ ΡΥΘΜΙΣΕΙΣ
# ─────────────────────────────────────────────

# Ενεργοποιεί το ποντίκι: κλικ σε panes/windows, resize με drag,
# scroll με τη ροδέλα μέσα στο ιστορικό
set -g mouse on

# Χρησιμοποιεί vi-style πλήκτρα στο copy mode
# (prefix + [ για είσοδο, μετά h/j/k/l, v για select, y για yank)
setw -g mode-keys vi


# ─────────────────────────────────────────────
#  ΑΡΙΘΜΗΣΗ ΑΠΟ ΤΟ 1 (αντί για 0)
# ─────────────────────────────────────────────

# Τα windows ξεκινούν από το 1 -> ταιριάζει με τη σειρά των πλήκτρων
# στο πληκτρολόγιο (prefix + 1 = πρώτο window)
set -g base-index 1

# Το ίδιο και για τα panes μέσα σε κάθε window
setw -g pane-base-index 1

# Όταν κλείνεις ένα window, τα υπόλοιπα ξαναριθμούνται αυτόματα
# ώστε να μη μένουν κενά (π.χ. 1, 3, 4 -> 1, 2, 3)
set -g renumber-windows on
