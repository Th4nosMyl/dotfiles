; =============================================================================
; GNOME Shell Extensions - dconf backup
; =============================================================================
;
; Τι είναι αυτό το αρχείο:
;   Είναι export (dump) των ρυθμίσεων dconf για τα GNOME Shell extensions,
;   από το path /org/gnome/shell/extensions/
;   Δημιουργήθηκε με:
;     dconf dump /org/gnome/shell/extensions/ > gnome-extensions-settings.conf
;
; Extensions που περιλαμβάνονται εδώ:
;   - dash-to-dock      : ρυθμίσεις dock (θέση, μέγεθος, hot-keys κ.λπ.)
;   - ding               : desktop icons (icons στην επιφάνεια εργασίας)
;   - just-perfection    : γενικές ρυθμίσεις UI/animations
;   - space-bar          : εμφάνιση workspace indicator στο top bar
;   - switcher           : alt-tab switcher ρυθμίσεις
;   - tactile            : grid layout για icons
;   - tiling-assistant   : auto-tiling παραθύρων
;   - vitals             : system monitor στο top bar (CPU/RAM/κλπ.)
;
; -----------------------------------------------------------------------------
; ΠΩΣ ΝΑ ΤΟ ΕΓΚΑΤΑΣΤΗΣΕΙΣ ΣΕ ΝΕΟ ΜΗΧΑΝΗΜΑ / ΜΕΤΑ ΑΠΟ FRESH INSTALL
; -----------------------------------------------------------------------------
;
; ΠΡΟΣΟΧΗ - ΔΙΑΒΑΣΕ ΠΡΙΝ ΤΡΕΞΕΙΣ ΤΙΠΟΤΑ:
;   Το "dconf load" ΑΝΤΙΚΑΘΙΣΤΑ πλήρως το path που δίνεις.
;   Αν το path /org/gnome/shell/extensions/ έχει ήδη κάτι (π.χ. ρυθμίσεις
;   από extensions που δεν υπάρχουν σε αυτό το αρχείο), αυτές οι ρυθμίσεις
;   ΘΑ ΣΒΗΣΤΟΥΝ. Οπότε αυτό κάνει sense μόνο σε καθαρή/φρέσκια εγκατάσταση,
;   ή αν ξέρεις τι κάνεις.
;
; Βήμα 1: Εγκατέστησε πρώτα τα ίδια extensions
;   Τα dconf keys δεν κάνουν τίποτα αν δεν είναι εγκατεστημένο το extension.
;   Εγκατάστησε τα από https://extensions.gnome.org ή μέσω apt/flatpak, π.χ.:
;     - Dash to Dock
;     - Desktop Icons NG (ding)
;     - Just Perfection
;     - Space Bar
;     - App Switcher / Alt-Tab (switcher)
;     - Tactile
;     - Tiling Assistant
;     - Vitals
;
; Βήμα 2: Ενεργοποίησε τα extensions
;   Μέσω του Extension Manager app, ή:
;     gnome-extensions enable <uuid-του-extension>
;   (τα uuid βρίσκονται στο https://extensions.gnome.org στη σελίδα κάθε extension)
;
; Βήμα 3: Φόρτωσε τις ρυθμίσεις από αυτό το αρχείο
;     dconf load /org/gnome/shell/extensions/ < gnome-extensions-settings.conf
;
; Βήμα 4: Κάνε logout/login (ή Alt+F2 -> r -> Enter σε Xorg, σε Wayland
;   χρειάζεται πλήρες logout/login) ώστε το GNOME Shell να διαβάσει τις
;   νέες ρυθμίσεις καθαρά.
;
; -----------------------------------------------------------------------------
; TIP: Αν θες μόνο ΕΝΑ extension (π.χ. μόνο dash-to-dock) αντί για όλα:
;   dconf dump /org/gnome/shell/extensions/dash-to-dock/ > dash-to-dock.conf
;   dconf load /org/gnome/shell/extensions/dash-to-dock/ < dash-to-dock.conf
; -----------------------------------------------------------------------------

[dash-to-dock]
background-opacity=0.80000000000000004
dash-max-icon-size=48
dock-fixed=false
dock-position='BOTTOM'
extend-height=false
height-fraction=0.90000000000000002
hot-keys=false
preferred-monitor=-2
preferred-monitor-by-connector='DP-3'
[ding]
check-x11wayland=true
show-home=false
[just-perfection]
animation=2
[space-bar/appearance]
application-styles='.space-bar {\n  -natural-hpadding: 12px;\n}\n\n.space-bar-workspace-label.active {\n  margin: 0 4px;\n  background-color: rgba(255,255,255,0.3);\n  color: rgba(255,255,255,1);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 4px;\n  border-width: 0px;\n  padding: 3px 8px;\n}\n\n.space-bar-workspace-label.inactive {\n  margin: 0 4px;\n  background-color: rgba(0,0,0,0);\n  color: rgba(255,255,255,1);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 4px;\n  border-width: 0px;\n  padding: 3px 8px;\n}\n\n.space-bar-workspace-label.inactive.empty {\n  margin: 0 4px;\n  background-color: rgba(0,0,0,0);\n  color: rgba(255,255,255,0.5);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 4px;\n  border-width: 0px;\n  padding: 3px 8px;\n}'
[space-bar/state]
version=39
[switcher]
activate-by-key=uint32 2
font-size=uint32 25
launcher-stats='{"gnome-keyboard-panel.desktop":2,"obsidian.desktop":1}'
matching=uint32 1
max-width-percentage=uint32 30
show-switcher=['<Alt>space']
[tactile]
use-accent-color=true
[tiling-assistant]
focus-hint-color='rgb(203,67,20)'
last-version-installed=54
overridden-settings={'org.gnome.mutter.edge-tiling': <@mb nothing>, 'org.gnome.mutter.keybindings.toggle-tiled-left': <@mb nothing>, 'org.gnome.mutter.keybindings.toggle-tiled-right': <@mb nothing>}
tiling-popup-all-workspace=true
[vitals]
alphabetize=true
battery-colors=@as []
fan-colors=@as []
fixed-widths=true
gpu-colors=@as []
hide-icons=false
hot-sensors=['_memory_usage_', '__network-rx_max__', '_processor_usage_']
icon-style=1
memory-colors=@as []
menu-centered=true
position-in-panel=2
processor-colors=@as []
show-fan=false
show-storage=false
show-system=false
system-colors=@as []
temperature-colors=@as []
use-higher-precision=false
